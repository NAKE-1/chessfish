<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chessfish dashboard</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #1e1f22; --panel: #26282c; --line: #34373c; --text: #dcdcdc; --muted: #9aa0a6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(280px, 520px) 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  #board svg { width: 100%; height: auto; display: block; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.pv { white-space: normal; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
  .muted { color: var(--muted); }
  #status { padding: 0 16px; color: var(--muted); }
  .best,.excellent { color: #8bc34a } .good { color: #9e9e9e } .inaccuracy { color: #e6c229 } .mistake { color: #f08a24 } .blunder { color: #e53935 }
  .scroll { max-height: 340px; overflow-y: auto; }
</style>
</head>
<body>
<p id="status">connecting…</p>
<main>
  <div>
    <section><div id="board"></div></section>
    <section><h2>Session</h2><div class="kv" id="session"></div></section>
  </div>
  <div>
    <section><h2>Engine</h2><table id="lines"></table></section>
    <section><h2>Game</h2><div class="kv" id="summary"></div><div class="scroll"><table id="plies"></table></div></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "–").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const cp = (v) => v == null ? "–" : Math.abs(v) >= 9000 ? `#${v < 0 ? "-" : ""}${Math.ceil((10000 - Math.abs(v)) / 2)}` : (v / 100).toFixed(2);
const ms = (v) => v == null ? "–" : v < 10000 ? (v / 1000).toFixed(1) : `${Math.floor(v / 60000)}:${String(Math.floor(v / 1000) % 60).padStart(2, "0")}`;
const kv = (pairs) => pairs.map(([k, v]) => `<span class="muted">${esc(k)}</span><span>${esc(v)}</span>`).join("");

function render(d) {
  if (!d.fen) { $("status").textContent = "waiting for data…"; return; }
  $("status").textContent = `live · ${new Date().toLocaleTimeString()}`;
  if (d.svg) $("board").innerHTML = d.svg;  // generated by python-chess on this PC
  $("session").innerHTML = kv([["Phase", d.phase], ["Link", `${d.link} · ${d.rtt}`], ["Friend RTT", d.friend_rtt], ["FEN", d.fen]]);
  const lines = d.analysis?.lines || [];
  $("lines").innerHTML = "<tr><th>#</th><th>Eval</th><th>WDL %</th><th>Depth</th><th>NPS</th><th>PV</th></tr>" +
    lines.map((l) => `<tr><td>${l.multipv}</td><td>${cp(l.cp)}</td><td>${l.wdl ? l.wdl.map((x) => (x / 10).toFixed(1)).join(" / ") : "–"}</td>` +
      `<td>${l.depth}/${l.seldepth}</td><td>${l.nps ? (l.nps / 1e6).toFixed(1) + "M" : "–"}</td><td class="pv">${esc(l.pv_san)}</td></tr>`).join("");
  const s = d.summary;
  $("summary").innerHTML = s ? kv(["white", "black"].map((c) => [c,
    `accuracy ${s[c].accuracy != null ? s[c].accuracy.toFixed(1) + "%" : "–"} · ACPL ${s[c].acpl != null ? s[c].acpl.toFixed(0) : "–"}`])) : "";
  $("plies").innerHTML = "<tr><th>Ply</th><th>Move</th><th>Grade</th><th>Eval</th><th>Acc</th><th>Think</th><th>Clock</th></tr>" +
    d.plies.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.san)}</td><td class="${p.class || ""}">${p.class || "…"}</td>` +
      `<td>${cp(p.cp_after)}</td><td>${p.accuracy != null ? p.accuracy.toFixed(0) : ""}</td><td>${ms(p.think_ms)}</td><td>${ms(p.clock_ms)}</td></tr>`).join("");
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (e) => render(JSON.parse(e.data));
  ws.onclose = () => { $("status").textContent = "disconnected — retrying…"; setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
